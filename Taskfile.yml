# ==============================================================================
# Nerd-Dock: GNOME tray indicator that controls streaming dictation
#
# Quickstart:
#   mise install               # pinned task + gitleaks
#   make install-system-deps   # OS packages (sudo, once)
#   make setup                 # venv with system site packages + dev deps
#   make test
#
# A thin Makefile shim forwards `make <target>` / `bobp make <target>` here.
# ==============================================================================

version: '3'

vars:
  TASK_BIN:
    sh: command -v task 2>/dev/null || command -v go-task 2>/dev/null || echo task
  VENV: venv
  PY: '{{.VENV}}/bin/python'

env:
  PATH: '{{.HOME}}/.local/share/mise/shims:{{.HOME}}/.local/bin:/snap/bin:{{.PATH}}'

tasks:
  default:
    aliases: [help]
    desc: Show available tasks
    silent: true
    cmds:
      - '{{.TASK_BIN}} --list'

  # --- Setup & Hooks ---

  check-system-deps:
    desc: Fail fast when the OS packages (gi, AppIndicator) are missing
    internal: true
    silent: true
    preconditions:
      - sh: python3 -c "import gi; gi.require_version('Gtk','3.0'); gi.require_version('AyatanaAppIndicator3','0.1')"
        msg: "GTK / AppIndicator bindings missing. Run 'make install-system-deps'."

  setup:
    desc: Create the venv (system site packages, needed for gi) and install dev deps
    sources:
      - pyproject.toml
    generates:
      - '{{.VENV}}/.setup.stamp'
    method: checksum
    cmds:
      - python3 -m venv --system-site-packages {{.VENV}}
      - '{{.VENV}}/bin/pip install --upgrade pip'
      - '{{.VENV}}/bin/pip install -e ".[dev]"'
      - touch {{.VENV}}/.setup.stamp

  install-hooks:
    desc: Enable repo git hooks (gitleaks pre-commit secret scan)
    silent: true
    preconditions:
      - sh: command -v gitleaks >/dev/null 2>&1
        msg: "gitleaks is not installed. Run 'mise install' first."
    cmds:
      - |
        if [ -d .git ]; then
          git config core.hooksPath .githooks
          chmod +x .githooks/pre-commit
          echo "Installed: .githooks/pre-commit (gitleaks protect --staged) via core.hooksPath"
        fi

  install:
    desc: Install Nerd-Dock with pipx (system site packages)
    deps: [check-system-deps]
    cmds:
      - task: install-hooks
      - pipx install . --system-site-packages --force

  # --- Quality Gates ---

  test:
    desc: Run unit tests with coverage (extra args via ARGS="..." or -- <args>)
    deps: [setup]
    cmds:
      - PYTHONPATH=. {{.PY}} -m pytest tests/ --cov=nerd_dock --cov-report=term-missing {{.CLI_ARGS}}

  lint:
    desc: Static analysis (ruff, radon, vulture, bandit, pylint duplicate-code)
    deps: [setup]
    cmds:
      - '{{.PY}} -m ruff check nerd_dock tests'
      - '{{.PY}} -m ruff format --check nerd_dock tests'
      - '{{.PY}} -m radon cc -s -nb nerd_dock'
      - '{{.PY}} -m vulture nerd_dock'
      - '{{.PY}} -m bandit -q -r nerd_dock'
      - '{{.PY}} -m pylint --disable=all --enable=duplicate-code nerd_dock'

  format:
    desc: Auto-format with ruff
    deps: [setup]
    cmds:
      - '{{.PY}} -m ruff format nerd_dock tests'
      - '{{.PY}} -m ruff check --fix nerd_dock tests'

  security-scan:
    desc: Run all build-time security scans
    cmds:
      - task: security-scan-secrets

  security-scan-secrets:
    desc: Scan git history for committed secrets (gitleaks, git-aware)
    preconditions:
      - sh: command -v gitleaks >/dev/null 2>&1
        msg: "gitleaks is not installed. Run 'mise install' first."
    cmds:
      - gitleaks detect --source .

  # --- Run & Cleanup ---

  run:
    desc: Install, then run the tray app (flags via ARGS="--stt-url http://host:8001")
    deps: [install, setup]
    cmds:
      - PYTHONPATH=. {{.PY}} -m nerd_dock.main {{.CLI_ARGS}}

  clean:
    desc: Remove caches and build outputs (keeps the venv)
    cmds:
      - rm -rf .pytest_cache .coverage htmlcov .ruff_cache .task build dist *.egg-info
      - find . -type d -name "__pycache__" -not -path "./{{.VENV}}/*" -exec rm -rf {} +

  distclean:
    desc: clean, and also remove the venv
    deps: [clean]
    cmds:
      - rm -rf {{.VENV}}
